server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        default_type text/plain;
        try_files /health =404;
    }

    location = /nginx_status {
        stub_status;
        access_log off;
        allow 127.0.0.1;
        deny all;
    }

    location = /metrics {
        proxy_pass http://127.0.0.1:9113/metrics;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
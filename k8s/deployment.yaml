apiVersion: apps/v1
kind: Deployment
metadata:
  name: dsaforge-frontend
  labels:
    app: dsaforge-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dsaforge-frontend
  template:
    metadata:
      labels:
        app: dsaforge-frontend
    spec:
      containers:
        - name: frontend
          image: 92512/dsaforge-frontend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20